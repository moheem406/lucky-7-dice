<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky-7-Dice</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class = "game-panel">
        <h1>Lucky 7 Dice</h1>

    <div class ="status">
        <div class ="lives">Lives❤️<span id ="lives">0</span></div>
        <div class ="win">Wins💪<span id ="win">0</span></div>
        <div class ="highscore">Scores👌<span id ="highscore">0</span></div>
    </div>
        <div class= "arena">
            <div class = "big-circle">
                <div class ="dice" id="dice1">?</div>
                <div class ="dice" id="dice2">?</div>
        </div>
        <div class= "message" id="message-box">
        Select A Prediction and Press Roll The Dice!!  
        </div>  
        <div class ="controller">
            <div class="tick-options"id="tick-options">
                <label class="tick-card">
                    <input type="radio" name="Prediction"value="more">
                    <span name="tick-box"></span>
                    <span name="label-tick">More than 7</span>
                </label>
                <label class="tick-card">
                    <input type="radio" name="Prediction"value="exact">
                    <span name="tick-box"></span>
                    <span name="label-tick">Exact 7</span>
                </label>
                <label class="tick-card">
                    <input type="radio" name="Prediction"value="less">
                    <span name="tick-box"></span>
                    <span name="label-tick">Less than 7</span>
                </label>
            </div>
    <button class="btn-roll" id="btn-roll">Roll dice🎲</button>
    <button class="btn-reset" id="btn-reset">Play Game🎮</button>
    <button class="btn-reset-hs" id="btn-reset-hs">Reset High Scores👌</button>
        </div>
        </div>
    </div>
 <script src="app.js"></script>
</body>
</html>
